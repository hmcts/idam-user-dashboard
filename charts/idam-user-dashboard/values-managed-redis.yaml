nodejs:
  keyVaults:
    idam-idam:
      secrets:
        - launchdarkly-sdk-key
        - idam-user-dashboard-client-secret
        - idam-user-dashboard-systemUser-username
        - idam-user-dashboard-systemUser-password
        - name: managed-redis-hostname
          alias: redis-hostname
        - name: managed-redis-port
          alias: redis-port
        - name: managed-redis-key
          alias: redis-key
        - AppInsightsConnectionString
